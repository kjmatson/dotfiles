set -g default-terminal "tmux-256color"
set-option -sa terminal-features ",xterm-256color:RGB"
set-option -g default-shell /usr/bin/fish
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-current-style "fg=blue bold"
set -g status-right "%H:%M"
set -g status-left "#S"
set -g prefix C-SPACE
set-option -g focus-events on
set -g set-clipboard on

# alacritty scrolling
set -g mouse on
set -ga terminal-overrides ',*256color*:smcup@:rmcup@'

set -g window-style 'bg=#141415'
set -g window-active-style 'bg=#141415'
set -g pane-border-style 'fg=#141415'
set -g pane-active-border-style 'fg=#141415'
set -g status-bg '#141415'

#vim.api.nvim_command('highlight Normal guibg=#141415 ctermbg=50')

bind E show-environment -g

